---
name: Code Linters

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches: [main, release-*]
    paths: ['**.sh', '**.yaml', '**.yml']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # https://github.com/redhat-plumbers-in-action/differential-shellcheck
  shell:
    name: Process shell scripts with ShellCheck
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v6
        with:
          # Differential ShellCheck requires full git history
          fetch-depth: 0

      - name: Differential ShellCheck
        id: shellcheck
        uses: redhat-plumbers-in-action/differential-shellcheck@v5
        with:
          exclude-path: vendor/
          triggering-event: >-
            ${{ case(
              github.event_name == 'workflow_dispatch', 'manual',
              github.event_name
            ) }}
          # yamllint disable rule:line-length
          base: >-
            ${{ case(
              github.event_name == 'workflow_dispatch', format('{0}^', github.ref_name),
              github.base_ref
            ) }}
          # yamllint enable rule:line-length
          head: >-
            ${{ case(
              github.event_name == 'workflow_dispatch', github.ref_name,
              github.head_ref
            ) }}

      - name: Upload SARIF report
        if: ${{ steps.shellcheck.outputs.sarif && !cancelled() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.shellcheck.outputs.sarif }}

  # https://github.com/fedora-copr/vcs-diff-lint-action
  yaml:
    name: Process YAML manifests with yamllint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v6
        with:
          fetch-depth: >-
            ${{ case(github.event_name == 'workflow_dispatch', 2, 1) }}

      - name: Differential yamllint
        id: yamllint
        uses: fedora-copr/vcs-diff-lint-action@v1
        with:
          debug: true
          linter_tags: yaml
          # Handle workflow_dispatch event
          pull_request_number_id: >-
            ${{ case(
              github.event_name == 'workflow_dispatch', 0,
              github.event.pull_request.number
            ) }}
          pull_request_head: >-
            ${{ case(
              github.event_name == 'workflow_dispatch', github.ref_name,
              github.event.pull_request.head.sha
            ) }}
          pull_request_commits: >-
            ${{ case(
              github.event_name == 'workflow_dispatch', 1,
              github.event.pull_request.commits
            ) }}
          args: >-
            /bin/sh -efuxc "env GITHUB_EVENT_NAME=${GITHUB_EVENT_OVERRIDE} /cmd"
        env:
          GITHUB_EVENT_OVERRIDE: >-
            ${{ case(
              github.event_name == 'workflow_dispatch', 'pull_request',
              github.event_name
            ) }}

      - name: Upload artifact with detected defects
        if: ${{ steps.yamllint.outputs.sarif && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: Differential yamllint SARIF
          path: ${{ steps.yamllint.outputs.sarif }}

